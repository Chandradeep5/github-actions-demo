name: CI

on:
  push:
    branches: [main,develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Run code
        run: python app.py